version: '3.8'

services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: room-app-frontend-dev
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
    restart: unless-stopped
    networks:
      - room-app-network

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: room-app-test
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
    command: npm test
    networks:
      - room-app-network
    profiles:
      - test

  test-watch:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: room-app-test-watch
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
    command: npm test -- --watch
    networks:
      - room-app-network
    profiles:
      - test

  test-coverage:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: room-app-test-coverage
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
    command: npm run test:coverage
    networks:
      - room-app-network
    profiles:
      - test

networks:
  room-app-network:
    driver: bridge

