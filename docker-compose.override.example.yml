# Пример файла docker-compose.override.yml для локальной разработки
# Этот файл автоматически подхватывается docker-compose, если существует
# Используйте его для переопределения настроек без изменения основного docker-compose.yml

version: '3.8'

services:
  frontend:
    ports:
      - "8080:80"  # Измените порт, если 3000 занят
    # Добавьте дополнительные переменные окружения, если нужно
    # environment:
    #   - DEBUG=true

